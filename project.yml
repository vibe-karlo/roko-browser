# Generates Browser.xcodeproj:  brew install xcodegen && xcodegen
name: Browser
options:
  bundleIdPrefix: com.growthstudio
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Browser:
    type: application
    platform: iOS
    sources:
      - path: Browser
        excludes:
          - "Info.plist"
      # What the app and its widgets share (the parking Live Activity, the widgets' data).
      - path: Shared
        excludes:
          - "*.entitlements"
    dependencies:
      - target: RokoWidgets
      - target: RokoShare
      - target: RokoAction
    info:
      path: Browser/Info.plist
      properties:
        CFBundleDisplayName: roko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          # A browser has to open plain-http sites; this only relaxes ATS inside web views.
          NSAllowsArbitraryLoadsInWebContent: true
          # Lets a debug build reach a share server running on this Mac (127.0.0.1).
          NSAllowsLocalNetworking: true
        # Where shared Browse for Me pages go (Server/share); empty hides Share.
        RokoShareServer: $(SHARE_SERVER)
        ITSAppUsesNonExemptEncryption: false
        # Open links in apps: whether YouTube, Instagram... are installed
        # (Browser/Web/AppLinks.swift; keep the two lists the same).
        LSApplicationQueriesSchemes: [airbnb, barcelona, booking, com.amazon.mobile.shopping, comgooglemaps, discord, ebay, etsy, fb, figma, github, instagram, linkedin, medium, nflx, notion, pinterest, reddit, soundcloud, spotify, tg, tiktok, tripadvisor, twitch, twitter, uber, whatsapp, wolt, youtube, youtubemusic, zoomus]
        # Notify Me: iOS wakes roko now and then to check watched pages.
        # iCloud sync: silent pushes bring other devices' changes.
        # YouTube plays on as sound with roko in the background (BackgroundPlay).
        UIBackgroundModes: [audio, fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.growthstudio.roko.watch, com.growthstudio.roko.today]
        # Today: the weather where you are, and what's on your calendar.
        NSMicrophoneUsageDescription: Hold + and speak to search, open a site or add a to-do. The microphone is on only while you hold it.
        NSSpeechRecognitionUsageDescription: What you say while holding + is turned into words for the address bar.
        NSLocationWhenInUseUsageDescription: Today shows the weather where you are, from a rough location. Paying for parking finds the zone you're in.
        # Parking: a zone border can run down the middle of a street, so a precise
        # fix is asked for just this once when precise location is off for roko.
        NSLocationTemporaryUsageDescriptionDictionary:
          Parking: Finding the parking zone you're in needs your exact location, just this once.
        # Paid parking's time left, on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        NSCalendarsFullAccessUsageDescription: Today shows what's left on your calendar for the day. It stays on this iPhone.
        NSRemindersFullAccessUsageDescription: Your to-dos and a list in Reminders are kept the same, so they're on your Mac and Watch too.
        # Pages: Save to Photos, and file fields that take a photo. Without
        # these iOS ends roko the moment a page reaches for them.
        NSPhotoLibraryAddUsageDescription: Images you save from a page go into your Photos.
        NSCameraUsageDescription: A page asked to take a photo or video, for example to upload it.
        # Settings → Lock private tabs and history.
        NSFaceIDUsageDescription: Private tabs and your history open only for you.
        # Downloads show in the Files app, under On My iPhone → roko.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Required before Apple will grant the browser entitlements (default
        # browser, passkeys): the app must declare it opens http and https.
        CFBundleURLTypes:
          - CFBundleURLName: Web
            CFBundleURLSchemes: [http, https]
          # roko's own links: the parking Live Activity opens roko://parking.
          - CFBundleURLName: roko
            CFBundleURLSchemes: [roko]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.growthstudio.roko
        # roko's server (Server/share): shared answers and Sync with your Mac
        # (README, "Sharing answers"). Empty: neither is offered.
        SHARE_SERVER: "https://roko-share.roko-browser.workers.dev"
        TARGETED_DEVICE_FAMILY: "1"
        # The Eclipse, drawn by Scripts/make_alternate_icons.swift from the roko logo design.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The alternates in Settings → App Icon (Scripts/make_alternate_icons.swift).
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        # The App Group shared with the widgets (Shared/WidgetSnapshot.swift).
        # Sync.entitlements and Browser.entitlements carry it too, for when
        # either replaces this file below.
        CODE_SIGN_ENTITLEMENTS: Shared/AppGroup.entitlements
        # Your team, kept here so regenerating the project doesn't drop it.
        DEVELOPMENT_TEAM: 6ZQC2F6CF2
        # iCloud sync (pins, history, settings) needs the paid Apple Developer
        # Program: a Personal team can't sign iCloud or push notifications.
        # Once the team is paid, uncomment both lines and run xcodegen.
        # ICLOUD_SYNC turns sync on in code; never set it without these
        # entitlements, or CloudKit traps. See README, "iCloud sync".
        # CODE_SIGN_ENTITLEMENTS: Browser/Sync.entitlements
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ICLOUD_SYNC
        # Once Apple grants your team the managed entitlements (browser,
        # passkeys, Private Cloud Compute), use these two lines instead: the
        # file has iCloud's entitlements too. The flag lets the app use Apple's
        # cloud model; never set it without the entitlement, or the first AI
        # request crashes. See README, "Apple's permissions".
        # CODE_SIGN_ENTITLEMENTS: Browser/Browser.entitlements
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ICLOUD_SYNC PRIVATE_CLOUD_COMPUTE
        ENABLE_PREVIEWS: YES

  # The parking Live Activity (Widgets/RokoWidgets.swift).
  RokoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
      - path: Shared
        excludes:
          - "*.entitlements"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: roko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.growthstudio.roko.widgets
        CODE_SIGN_ENTITLEMENTS: Shared/AppGroup.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6ZQC2F6CF2
        SKIP_INSTALL: YES

  # roko in other apps' share sheets (ShareExtension/ShareViewController.swift).
  RokoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "Info.plist"
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: roko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A page's link, or words you selected.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.growthstudio.roko.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6ZQC2F6CF2
        SKIP_INSTALL: YES

  # Open in roko, in the list of actions under a share sheet (as Arc's
  # Open in Arc Search). Same code as RokoShare; its icon is the Eclipse
  # alone, on clear, as iOS draws an action from its shape.
  RokoAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ActionExtension
        excludes:
          - "Info.plist"
      - path: ShareExtension/ShareViewController.swift
    info:
      path: ActionExtension/Info.plist
      properties:
        CFBundleDisplayName: Open in roko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActionWantsFullScreenPresentation: false
            NSExtensionServiceAllowsFinderPreviewItem: false
            # A page's link only: words you select go to roko from its app icon above.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.growthstudio.roko.action
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6ZQC2F6CF2
        SKIP_INSTALL: YES
