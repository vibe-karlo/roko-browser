name: RealBench
options: { bundleIdPrefix: com.growthstudio, deploymentTarget: { iOS: "17.0" } }
settings:
  base:
    DEVELOPMENT_TEAM: 38LY88937Z
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  RealBenchHost:
    type: application
    platform: iOS
    sources: [Host]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.growthstudio.realbench, INFOPLIST_KEY_UILaunchScreen_Generation: YES } }
  RealBenchUI:
    type: bundle.ui-testing
    platform: iOS
    sources: [UI]
    dependencies: [{ target: RealBenchHost }]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.growthstudio.realbench.ui, TEST_TARGET_NAME: RealBenchHost } }
schemes:
  RealBench:
    build: { targets: { RealBenchHost: all, RealBenchUI: [test] } }
    test: { targets: [RealBenchUI] }
